<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movies</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR74Vvst-QNlSfp457cDOrWJsnCxEH6Uvp1tQ&s">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="topNav">
    <a class="active" href="index.html">Movie</a>
    <a href="favorites.html">❤️ Favorites</a>
    <a href="watchlist.html">📌 Watchlist</a>
    <a href="watched.html">✅ Watched</a>
    <button id="theme-toggle" aria-label="Toggle dark/light mode">🌙</button>
    <div class="searchBar">
        <form role="form" id="form">
            <input type="search" id="query" name="q" placeholder="Search Movies...">
        </form>
    </div>
    <button id="authToggleBtn">Login</button>
</div>

<!-- Auth Modal -->
<div id="authModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <span id="closeModal" class="modal-close">&times;</span>

        <div id="loggedOutView">
            <h3 id="modalTitle">Login</h3>
            <input type="text" id="authUsername" placeholder="Username"><br>
            <input type="email" id="authEmail" placeholder="Email" style="display:none;"><br>
            <input type="password" id="authPassword" placeholder="Password"><br>
            <label><input type="checkbox" id="togglePassword"> Show password</label><br>
            <button id="submitAuthBtn">Login</button>
            <p id="toggleAuthMode">Don't have an account? <a href="#" id="switchToSignup">Sign up</a></p>
        </div>

        <div id="loggedInView" style="display:none;">
            <h3>Welcome, <span id="welcomeUser"></span></h3>
            <button id="logoutBtn">Logout</button>
        </div>
    </div>
</div>

<div class="genre-wrapper">
    <button class="genre-btn">Genres</button>
    <div class="genre">
        <!-- JS will fill labels here -->
    </div>
</div>

<div class="sort-wrapper">
    <button class="sort-btn">Sort By</button>
    <div class="sort-options">
        <!-- JS will fill here -->
    </div>
</div>

<div style="padding-top: 20px">
    <section id="section">
        <!--
        <div class="row">
            <div class="column">
                <div class="card">
                    <center><img src="mohamed_hassan-cinema-4153289_1920.jpg" class="thumbnail"></center>
                    <h3>Movie Title</h3>
                </div>
            </div>
        </div>
        -->
    </section>
</div>

<div style="text-align:center; padding: 20px;">
    <button id="loadMore">Load More</button>
</div>

</body>
<script src="script.js"></script>
</html>
